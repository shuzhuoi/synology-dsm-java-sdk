# Core System 官方契约覆盖示例配置。
# 运行前请复制本文件为 coresystem-coverage.yaml，并填写真实 DSM 信息。

# DSM 服务地址，例如：https://nas.example.com:5001
dsmUrl: "https://your-nas-host:5001"

# DSM 登录账号。
account: "your-account"

# DSM 登录密码。真实文件 coresystem-coverage.yaml 已被 .gitignore 忽略，请不要提交。
password: "your-password"

# 可选：电源操作演练项，支持 shutdown / reboot。
# 危险操作：填写后示例会真实关机或重启目标 NAS！默认留空，只演示只读接口。
powerAction: ""
