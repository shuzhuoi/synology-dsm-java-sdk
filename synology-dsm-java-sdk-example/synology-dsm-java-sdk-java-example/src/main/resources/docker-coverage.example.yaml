# Docker 官方契约覆盖示例配置。
# 运行前请复制本文件为 docker-coverage.yaml，并填写真实 DSM 信息。
# 注意：SYNO.Docker.* 通常需要管理员或具有 Container Manager 权限的账户。

# DSM 服务地址，例如：https://nas.example.com:5001
dsmUrl: "https://your-nas-host:5001"

# DSM 登录账号。
account: "your-account"

# DSM 登录密码。真实文件 docker-coverage.yaml 已被 .gitignore 忽略，请不要提交。
password: "your-password"

# 可选：详情与日志演练的目标容器名称，例如 jellyfin。
# 留空（默认）跳过详情和日志段演示。
containerName: ""

# 可选：生命周期演练项，支持 start / stop / restart。
# 危险操作：填写后示例会真实启停目标容器（需同时配置 containerName）！
# 默认留空，只演示只读接口。
lifecycleAction: ""

# 可选：详情演练的目标镜像仓库名，例如 nginx、grafana/grafana（tag 固定使用 latest）。
# 留空（默认）跳过镜像详情段演示。
imageName: ""

# 可选：拉取演练的镜像仓库，例如 nginx。
# 危险操作：填写后示例会真实从仓库拉取镜像（占用带宽与磁盘）！
# 默认留空，跳过镜像拉取段演示。
pullRepository: ""

# 可选：拉取演练的镜像标签，默认 latest。
pullTag: ""

# 可选：详情演练的目标 Compose 项目名称（Container Manager 中显示的名称）。
# 留空（默认）跳过项目详情段演示。
projectName: ""

# 可选：项目生命周期演练项，支持 start / stop / restart / clean / delete。
# 危险操作：clean 会停止并移除项目容器（compose down），delete 会删除整个项目！
# 填写后示例会真实操作目标项目（需同时配置 projectName），默认留空。
projectAction: ""
