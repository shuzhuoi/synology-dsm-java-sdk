# 持续集成：推送 main 或发起 PR 时自动构建并运行全部单元测试。
# 项目约定使用 JDK 17 构建整个 Reactor（core 等模块编译目标为 Java 8，
# spring-boot3-starter 为 Java 17），CI 环境与之一致。
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 构建并运行测试
        # local-build profile 仅跳过 GPG 签名，供无签名密钥的环境使用
        run: mvn -B -ntp -P local-build test
