# Dependabot：每周检查 Maven 依赖与 GitHub Actions 版本更新并自动提 PR。
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    ignore:
      # OkHttp 3.14.x 是官方最后一个支持 Java 8 的主版本；5.x 改为 Kotlin 多平台发布，
      # 原坐标不再提供可用的 JVM jar，升级会直接编译失败
      - dependency-name: com.squareup.okhttp3:okhttp
        versions: [ ">=4" ]
      # JUnit 6 的 jar 是 Java 17 字节码，测试 JVM 需 Java 17+（本项目构建固定 JDK 17，
      # 实测可编译运行）；仅测试依赖，升级无用户可见收益，保守起见不跟随
      - dependency-name: org.junit.jupiter:*
        versions: [ ">=6" ]
      # 2.7.18 是 Spring Boot 2.x 的终结版本，boot2-starter 必须固定在该线，
      # 对该版本属性的任何升级请求一律忽略（不给 versions 限定，全部拦截）
      - dependency-name: spring-boot2.version
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

